version: 2
jobs:
  build:
    working_directory: ~/project/go
    docker:
      - image: cimg/go:1.19.0

    steps:
      - checkout:
          path: ~/project/

      - run: mkdir bin
      - run: go get -d -v ./...
      - run: go test -d -v ./...
      - run: go build -o bin/blog.exe github.com/{USER}/{REPOSITORY_ROOT}

      - store_artifacts:
          path: bin/
          destination: blog-app