<!DOCTYPE html>
<html>
<head>
    <title>Verifikasi Email</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link href='https://fonts.googleapis.com/css?family=Rubik' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Poppins' rel='stylesheet'>
    <style type="text/css">
        @import url(https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap);
        @import url(https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap);

        img {
            border: 0;
            height: auto;
            line-height: 100%;
            outline: none;
            text-decoration: none;
        }

        table {
            border-collapse: collapse !important;
        }

        body {
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
        }

        /* iOS BLUE LINKS */
        a[x-apple-data-detectors] {
            color: inherit !important;
            text-decoration: none !important;
            font-size: inherit !important;
            font-family: inherit !important;
            font-weight: inherit !important;
            line-height: inherit !important;
        }

        /* MOBILE STYLES */
        @media screen and (max-width:600px) {
            h1 {
                font-size: 32px !important;
                line-height: 32px !important;
            }
        }

        /* ANDROID CENTER FIX */
        div[style*="margin: 16px 0;"] {
            margin: 0 !important;
        }
    </style>
</head>

<body style="background-color: #f4f4f4; margin: 0 !important; padding: 0 !important;">
    <table border="0" cellpadding="0" cellspacing="0" width="100%">
        <!-- Body Bridge -->
        <tr>
            <td align="center">
                <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px;">
                    <tr>
                        <td align="center" valign="top" style="padding: 40px 10px 40px 10px;">
                            <!-- <img src=" https://img.icons8.com/clouds/100/000000/handshake.png" width="125" height="120" style="display: block; border: 0px;" /> -->
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr>
            <td align="center" style="padding: 0px 10px 0px 10px;">
                <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px;">
                    <tr>
                        <td bgcolor="#ffffff" align="left" valign="top" style="padding: 20px 20px 20px 20px; border-radius: 4px 4px 0px 0px; color: #111111; font-family: 'Rubik'; font-size: 48px; font-weight: 400; letter-spacing: 4px; line-height: 48px;">
                            <img src="https://drive.google.com/thumbnail?id=1co0TxlyQ9S1DltRSPg6e5pjkSueYg8-T" width="235px" height="96px" style="display: block; border: 0px;"/>
                        </td>
                    </tr>
                    <tr>
                        <td bgcolor="#ffffff" align="center" valign="top" style="padding: 20px 20px 30px 20px; border-radius: 4px 4px 0px 0px; color: #111111; font-family: 'Rubik'; font-size: 48px; font-weight: 400; letter-spacing: 4px; line-height: 48px;">
                            <img src="https://drive.google.com/thumbnail?id=1VDf4SSx6lpK5__7h_ox6rQ2v0dHsze6g" width="162px" height="124px" style="display: block; border: 0px;" />
                            
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr>
            <td bgcolor="#f4f4f4" align="center" style="padding: 0px 10px 0px 10px;">
                <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px;">
                    <tr>
                        <td bgcolor="#ffffff" align="left" style="padding: 20px 30px 40px 30px; color: #666666; font-family: 'Rubik', Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 400; line-height: 25px;">
                            <h3 style="margin-bottom: 5%;font-weight: 700;color: #111111;font-family: 'Poppins', Helvetica, Arial, sans-serif;font-size: 24px;">Akun Bridge</h3>
                            <p style="margin-bottom: 2%;">Hi {{.name}},</p>
                            <p style="margin: 0;">Untuk dapat mengakses akun Bridge kamu, silahkan masuk akun Bridge dengan email dan kata sandi dibawah ini :</p>
                        </td>
                    </tr>
                    <tr>
                        <td bgcolor="#ffffff" align="left">
                            <table width="100%" border="0" cellspacing="0" cellpadding="0">
                                <tr>
                                    <td bgcolor="#ffffff" align="center" style="padding: 0px 30px 60px 30px;">
                                        <table border="0" cellspacing="0" cellpadding="0">
                                            <tr>
                                                <td align="left" style="font-size: 16px; font-family: 'Rubik', Helvetica, Arial, sans-serif; text-decoration: none; color: #ffffff; text-decoration: none; padding:0px 150px 20px 15px; border-radius: 8px; border: 1px solid #DADADA; display: inline-block;">
                                                    <p style="margin-bottom: 2%;color: #DADADA">Email</p>
                                                    <p style="margin-bottom: 2%;color: #111111">{{.email}}</p>
                                                    <p style="margin-bottom: 2%;color: #DADADA">Kata Sandi</p>
                                                    <p style="margin-bottom: 2%;color: #111111">{{.password}}</p>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td bgcolor="#ffffff" align="left" style="padding: 0px 30px 60px 30px; border-radius: 0px 0px 4px 4px; color: #666666; font-family: 'Rubik', Helvetica, Arial, sans-serif; font-size: 18px; line-height: 25px;">
                            <p style="margin: 0;">Hormat Kami,</p>
                            <p style="margin: 0;font-weight: 700;color: #111111">Bridge</p>
                        </td>
                    </tr>
                    <tr>
                        <td bgcolor="#ffffff" align="left" style="padding: 0px 30px 0px 30px; border-radius: 0px 0px 4px 4px; color: #666666; font-family: 'Rubik', Helvetica, Arial, sans-serif; font-size: 12px; line-height: 25px;">
                            <p>© 2020 PT.Bank Rakyat Indonesia (Persero) Tbk</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr>
            <td align="center">
                <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px;">
                    <tr>
                        <td align="center" valign="top" style="padding: 40px 10px 40px 10px;"> </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
